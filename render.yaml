services:
  - type: web
    name: genhire-api
    runtime: python
    # Pin Python to 3.12 — scikit-learn, scipy, numpy all have pre-built wheels for 3.12.
    # Python 3.14 (Render's current default) has no wheels for these packages yet.
    pythonVersion: "3.12.7"
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn GenHire.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # Render Free Tier blocks outbound SMTP ports 25, 465, 587.
      # Use console backend so Django doesn't try SMTP at all.
      # Actual email delivery goes through Resend HTTPS REST API (port 443).
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
      - key: EMAIL_HOST
        value: ""
      - key: EMAIL_PORT
        value: "443"
      - key: EMAIL_HOST_USER
        value: ""
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "False"
      - key: EMAIL_TIMEOUT
        value: "5"
      - key: RABBITMQ_ENABLED
        value: "False"
      - key: RESEND_API_KEY
        sync: false
      - key: AUTO_VERIFY_EMAIL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
